<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" style="border-bottom: 2px solid #222; padding: 30px 0;">
        <h1>Design system</h1>
    </div>

    <div class="container" style="border-bottom: 2px solid #eee;">
        <h2 style="margin: 20px 0;">Headings</h2>
    </div>

    <div class="container">

        <h1>This is the h1</h1>

        <h2>This is the h2</h2>

        <h3>This is the h3</h3>

        <h4>This is the h4</h4>

        <h5>This is the h5</h5>

        <h6>This is the h6</h6>

    </div>

    <div class="container" style="border-top: 2px solid #222;border-bottom: 2px solid #eee;">
        <h2>Font-size</h2>
    </div>

    <div class="container"  style="margin: 50px auto;">
        <p class="font-xs">X-Small font</p>
        <p class="font-sm">Small font</p>
        <p>Base font</p>
        <p class="font-lg">Large font</p>
    </div>


    <div class="container" style="border-top: 2px solid #222;border-bottom: 2px solid #eee;">
        <h2>Buttons</h2>
    </div>

    <div class="container"  style="margin: 50px auto;">
        <button class="button button--primary">Primary</button>
        <!-- <button class="button button--secondary">Secondary</button> -->
        <button class="button button--outline">Outline</button>
        <button class="button button--text">Text</button>
    </div>

    <footer class="container">
        © 2022 | JPBelley
    </footer>
</body>
</html>
